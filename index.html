<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minigame</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(circle at 50% 30%, #2b2b45, #14141f 70%);
            color: #fff;
            overflow: hidden;
        }
        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 24px;
        }
        h2 {
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(79, 140, 255, 0.5);
        }
        #board {
            position: relative;
            width: 420px;
            height: 420px;
        }
        .ball {
            position: absolute;
            top: 0;
            left: 0;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff8a65, #d84315 75%);
            box-shadow: 0 6px 14px rgba(0,0,0,0.45), inset -6px -6px 14px rgba(0,0,0,0.35);
            cursor: default;
            will-change: transform;
            transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ball.clickable {
            cursor: pointer;
        }
        .ball.clickable:hover {
            filter: brightness(1.1);
        }
        .ball.highlight {
            background: radial-gradient(circle at 30% 30%, #81d4fa, #0288d1 75%);
            box-shadow: 0 0 30px 12px #4fc3f7, 0 6px 14px rgba(0,0,0,0.45);
        }
        #start-btn {
            padding: 14px 42px;
            font-size: 1.15rem;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, #4f8cff, #2d5fd8);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(79, 140, 255, 0.45);
            transition: transform 0.15s ease;
        }
        #start-btn:hover {
            transform: translateY(-3px);
        }
        #status {
            min-height: 1.4em;
            font-size: 1.05rem;
            opacity: 0.85;
        }
        #message-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 16, 0.92);
            text-align: center;
            padding: 40px;
            z-index: 10;
        }
        #message-overlay.show {
            display: flex;
        }
        #message-text {
            font-size: 1.8rem;
            max-width: 700px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h2>Theo dõi quả bóng sáng lên, sau khi bị xáo trộn hãy chọn lại đúng quả đó</h2>
        <div id="board"></div>
        <div id="status"></div>
        <button id="start-btn">Bắt đầu</button>
    </div>

    <div id="message-overlay">
        <div id="message-text"></div>
    </div>

    <script>
        const NUM_BALLS = 6;
        const board = document.getElementById('board');
        const startBtn = document.getElementById('start-btn');
        const statusEl = document.getElementById('status');
        const overlay = document.getElementById('message-overlay');
        const messageText = document.getElementById('message-text');

        const RICKROLL_URL = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';

        // ball[i] = DOM element with fixed identity id = i
        const balls = [];
        // order[slot] = ballId currently sitting in that slot
        let order = [];
        let targetBallId = null;
        let clickEnabled = false;

        function computePositions() {
            const size = board.clientWidth; // board is square
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = size / 2 - 45;
            const positions = [];
            for (let i = 0; i < NUM_BALLS; i++) {
                const angle = (Math.PI * 2 / NUM_BALLS) * i - Math.PI / 2;
                positions.push({
                    x: centerX + radius * Math.cos(angle) - 35,
                    y: centerY + radius * Math.sin(angle) - 35
                });
            }
            return positions;
        }

        let positions = [];

        function initBoard() {
            board.innerHTML = '';
            balls.length = 0;
            order = [];
            for (let i = 0; i < NUM_BALLS; i++) {
                const el = document.createElement('div');
                el.className = 'ball';
                el.dataset.id = i;
                board.appendChild(el);
                balls.push(el);
                order.push(i);
            }
            positions = computePositions();
            placeBalls();
        }

        function placeBalls() {
            for (let slot = 0; slot < NUM_BALLS; slot++) {
                const ballId = order[slot];
                const pos = positions[slot];
                balls[ballId].style.transform = `translate(${pos.x}px, ${pos.y}px)`;
            }
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function showMessage(text) {
            messageText.textContent = text;
            overlay.classList.add('show');
        }

        function hideMessage() {
            overlay.classList.remove('show');
        }

        function setStatus(text) {
            statusEl.textContent = text;
        }

        function shuffleStep(remainingTime, doneCallback) {
            if (remainingTime <= 0) {
                doneCallback();
                return;
            }
            const stepDuration = randomInt(140, 200);
            const slotA = randomInt(0, NUM_BALLS - 1);
            let slotB = randomInt(0, NUM_BALLS - 1);
            while (slotB === slotA) {
                slotB = randomInt(0, NUM_BALLS - 1);
            }
            // swap
            const tmp = order[slotA];
            order[slotA] = order[slotB];
            order[slotB] = tmp;
            placeBalls();

            setTimeout(() => {
                shuffleStep(remainingTime - stepDuration, doneCallback);
            }, stepDuration);
        }

        function enableClicks() {
            clickEnabled = true;
            balls.forEach(b => {
                b.classList.add('clickable');
                b.addEventListener('click', onBallClick);
            });
            setStatus('Chọn quả bóng bạn nghĩ là quả ban đầu được sáng lên!');
        }

        function disableClicks() {
            clickEnabled = false;
            balls.forEach(b => {
                b.classList.remove('clickable');
                b.removeEventListener('click', onBallClick);
            });
        }

        function onBallClick(e) {
            if (!clickEnabled) return;
            const chosenId = parseInt(e.currentTarget.dataset.id, 10);
            disableClicks();

            if (chosenId === targetBallId) {
                // ĐÚNG
                e.currentTarget.classList.add('highlight');
                setStatus('');
                setTimeout(() => {
                    showMessage("Đúng!, nhưng mày vừa phí thời gian để chơi cái này🤡");
                    setTimeout(() => {
                        
                    }, 2500);
                }, 400);
            } else {
                // SAI - mở thẳng link rickroll trong tab mới
                setStatus('');
                showMessage("Mày bị ngu à?");
                setTimeout(() => {
                    window.open(RICKROLL_URL, "_blank");
                    hideMessage();
                    startBtn.style.display = 'inline-block';
                }, 2000);
            }
        }

        function startRound() {
            startBtn.style.display = 'none';
            hideMessage();
            initBoard();
            setStatus('Chú ý quả bóng sắp sáng lên...');

            // reset order mỗi round
            targetBallId = randomInt(0, NUM_BALLS - 1);

            setTimeout(() => {
                balls[targetBallId].classList.add('highlight');
                setStatus('Ghi nhớ quả bóng này!');

                setTimeout(() => {
                    balls[targetBallId].classList.remove('highlight');
                    setStatus('Đang xáo trộn...');

                    const shuffleDuration = randomInt(8000, 12000);
                    shuffleStep(shuffleDuration, () => {
                        enableClicks();
                    });
                }, 1600);
            }, 600);
        }

        startBtn.addEventListener('click', startRound);

        window.addEventListener('resize', () => {
            if (balls.length) {
                positions = computePositions();
                placeBalls();
            }
        });
    </script>
</body>
</html>
