    <style>
        body { 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            padding-top: 50px;
            overflow-x: hidden;
        }
        h1 { 
            font-size: 80px; 
            margin-bottom: 10px; 
            color: #ffcc00; 
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
        }
        
        p { 
            font-size: 25px; 
            line-height: 1.6; 
            color: #008ab4; 
            text-shadow: 1px 1px 2px #000; 
            text-shadow: 0 0 20px #0580a5;
        } 
        h3 { 
            font-size: 40px; 
            color: #ffaa00; 
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
        }
        h2 { 
            font-size: 35px; 
            color: #ffaa00; 
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
        }
        h4 { 
            font-size: 30px; 
            color: #cc8902; 
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
            text-align: center;
            position: relative; 
            left: -50px; /* Số âm là nhảy sang trái, số dương là sang phải */
        }


        
        /* Hiệu ứng nút bấm xịn xò */
        .btn-engine { 
            background-color: #ffcc00; 
            border: none; 
            padding: 20px 40px; 
            font-size: 24px;
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
            transition: 0.3s; 
            color: #000;
            text-decoration: none;
            display: inline-block;
        }

        .btn-engine:hover { 
            background-color: #ffffff; 
            color: #000000;
            transform: scale(1.15) rotate(2deg); /* Rung nhẹ cho ngầu */
            box-shadow: 0 0 30px #ffcc00;
        }
    </style>
