<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Phucfarm - Dev</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            padding-top: 50px;
            overflow-x: hidden;
        }
        h1 { 
            font-size: 80px; 
            margin-bottom: 10px; 
            color: #ffcc00; 
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
        }
        
        p { 
            font-size: 25px; 
            line-height: 1.6; 
            color: #008ab4; 
            text-shadow: 1px 1px 2px #000; 
            text-shadow: 0 0 20px #0580a5;
        } 
        h3 { 
            font-size: 40px; 
            color: #ffaa00; 
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
        }
        
        /* Hiệu ứng nút bấm xịn xò */
        .btn-engine { 
            background-color: #ffcc00; 
            border: none; 
            padding: 20px 40px; 
            font-size: 24px;
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
            transition: 0.3s; 
            color: #000;
            text-decoration: none;
            display: inline-block;
        }

        .btn-engine:hover { 
            background-color: #ffffff; 
            color: #000000;
            transform: scale(1.15) rotate(2deg); /* Rung nhẹ cho ngầu */
            box-shadow: 0 0 30px #ffcc00;
        }
    </style>
</head>
<body>

    <h1>Phucfarm</h1>

    <p>Hello, Tao là phúc:</p>
    <p> - Là một thằng dev lớp 6</p>

    <h3>Những Game, Tool, Dự án của Phúc</h3>

    <button class="btn-engine" onclick="openEngine()">UpSet Engine</button>

    <script>
      function openEngine() {
          const privateRepoUrl = "https://github.com/Phucfarm/UpSet";
          let checkWin = window.open(privateRepoUrl, "PhucCheck", "width=200,height=200,top=100,left=100");
          if (!checkWin || checkWin.closed || typeof checkWin.closed == 'undefined') {
              alert("Errol Pop up blocker!");
          } else {
              setTimeout(() => {
                  checkWin.close();
                  window.open(privateRepoUrl, "_blank");
              }, 2000);
          }
      }
  </script>

</body>
</html>
