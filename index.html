<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Phucfarm</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            padding-top: 50px;
        }
        h1 { 
            font-size: 80px; 
            margin-bottom: 10px; 
            color: #ffcc00; 
        }
        p { 
            font-size: 25px; 
            line-height: 1.6; 
            color: #008ab4; 
            /* Sửa outline sai thành text-shadow cho chữ nổi bật */
            text-shadow: 1px 1px 2px #000; 
        } 
        h3 { 
            font-size: 40px; 
            color: #ffaa00; 
        }
        
        button { 
            background-color: #ffcc00; 
            border: none; 
            padding: 20px 40px; 
            font-size: 24px;
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
            transition: 0.3s; 
        }

        button:hover { 
            background-color: #ffffff; 
            color: #000000;
            transform: scale(1.15); 
        }
    </style>
</head>
<body>

    <h1>Phucfarm</h1>

    <p>Hello, Tao là phúc:</p>
    <p> - Là một thằng dev lớp 6</p>

    <h3>Những Game, Tool, Dự án của Phúc</h3>

    <a href="https://github.com/Phucfarm/UpSet" target="_blank">
        <button>UpSet Engine</button>
    </a>

</body>
</html>
